<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prototype Sistem Klinik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
  /* Konsep: cerita per masalah. Kiri: masalah dan hasilnya dalam bahasa owner. Kanan: layar aplikasi yang bisa diklik. */
  :root {
    --bg: #f3f6f7;
    --surface: #ffffff;
    --surface-2: #edf2f4;
    --ink: #0e1a21;
    --ink-2: #44535c;
    --muted: #78868e;
    --line: #dbe2e6;
    --accent: #2a78d6;
    --accent-text: #1c5cab;
    --accent-soft: #e2edfb;
    --on-accent: #ffffff;
    --good: #0ca30c;
    --good-ink: #006300;
    --good-soft: #e3f4e3;
    --warn: #fab219;
    --warn-ink: #7a5200;
    --warn-soft: #fdf1d3;
    --bad: #d03b3b;
    --bad-ink: #a42525;
    --bad-soft: #fbe5e5;
    --series-1: #2a78d6;
    --grid: #e3e8ea;
    --axis: #c3cbd0;
    --c-p: #e2edfb;
    --c-s: #fdf1d3;
    --c-m: #dcf1ec;
    --c-long: #ece8fb;
    --shadow: 0 1px 2px rgba(14, 26, 33, 0.06), 0 8px 24px rgba(14, 26, 33, 0.06);
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1317;
      --surface: #141c22;
      --surface-2: #1b252c;
      --ink: #eaf0f3;
      --ink-2: #b4c1c8;
      --muted: #8a979f;
      --line: #27333b;
      --accent: #3987e5;
      --accent-text: #6da7ec;
      --accent-soft: #162a43;
      --on-accent: #ffffff;
      --good-ink: #3ec43e;
      --good-soft: #14301a;
      --warn-ink: #fab219;
      --warn-soft: #3a2d0c;
      --bad-ink: #ee7a7a;
      --bad-soft: #3a1717;
      --series-1: #3987e5;
      --grid: #232e35;
      --axis: #38454e;
      --c-p: #162a43;
      --c-s: #3a2d0c;
      --c-m: #12332d;
      --c-long: #2a2447;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1317;
    --surface: #141c22;
    --surface-2: #1b252c;
    --ink: #eaf0f3;
    --ink-2: #b4c1c8;
    --muted: #8a979f;
    --line: #27333b;
    --accent: #3987e5;
    --accent-text: #6da7ec;
    --accent-soft: #162a43;
    --on-accent: #ffffff;
    --good-ink: #3ec43e;
    --good-soft: #14301a;
    --warn-ink: #fab219;
    --warn-soft: #3a2d0c;
    --bad-ink: #ee7a7a;
    --bad-soft: #3a1717;
    --series-1: #3987e5;
    --grid: #232e35;
    --axis: #38454e;
    --c-p: #162a43;
    --c-s: #3a2d0c;
    --c-m: #12332d;
    --c-long: #2a2447;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 56px;
  }
  .muted { color: var(--muted); }
  .sub { color: var(--ink-2); }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Banner & header */
  .demo-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--warn-soft); color: var(--warn-ink);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    border-radius: 10px; padding: 8px 12px; font-size: 13px;
  }
  .demo-bar svg { width: 18px; height: 18px; flex: none; }
  svg { max-width: 100%; }
  .topbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 18px 0 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .logo svg { width: 16px; height: 16px; stroke: var(--on-accent); }

  /* Buttons & chips */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink);
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn svg, .chip svg { width: 15px; height: 15px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
  }
  .chip.good { background: var(--good-soft); color: var(--good-ink); }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .chip.info { background: var(--accent-soft); color: var(--accent-text); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; min-height: 36px; font-weight: 500; color: var(--ink-2);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  /* Index */
  .hero h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; font-weight: 800; }
  .hero p { margin-top: 12px; max-width: 62ch; color: var(--ink-2); font-size: 17px; }
  .bab { margin-top: 32px; }
  .bab h2 { font-size: 20px; line-height: 1.25; }
  .bab > p { margin-top: 4px; max-width: 70ch; color: var(--ink-2); font-size: 14px; }
  .bab .cards { margin-top: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-top: 28px; }
  .card-link {
    display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: inherit; min-width: 0;
  }
  .card-link:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .card-link .n { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .card-link h3 { font-size: 17px; line-height: 1.3; }
  .card-link .a { font-size: 13px; color: var(--muted); }
  .card-link .b { font-size: 13px; color: var(--ink-2); }

  /* Scene */
  .scene-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
  .scene { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 28px; align-items: start; }
  .story { display: flex; flex-direction: column; gap: 16px; }
  .story h2 { font-size: clamp(22px, 3vw, 28px); line-height: 1.2; font-weight: 800; }
  .story .tag { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .box { border-radius: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
  .box small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
  .box.before small { color: var(--bad-ink); }
  .box.after small { color: var(--good-ink); }
  .stage { display: flex; justify-content: center; min-width: 0; }
  .app {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
  }
  .app.wide { max-width: 100%; }
  .app-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .app-bar b { font-family: var(--font-display); font-size: 15px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .app-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }
  .panel { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); min-width: 0; }
  .panel.soft { background: var(--surface-2); border-color: transparent; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile .l { font-size: 12px; color: var(--muted); }
  .tile .v { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .hero-fig { font-family: var(--font-display); font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
  .list { display: flex; flex-direction: column; }
  .li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .rowbtn { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; color: inherit; cursor: pointer; min-width: 0; }
  .rowbtn:hover { border-color: var(--series-1); }
  .rowbtn .rb-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rowbtn .rb-main small { color: var(--muted); font-size: 12px; }
  .rowbtn > svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .li .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .li .t small { display: block; color: var(--muted); font-size: 12px; }
  .ava { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  td.r, th.r { text-align: right; }
  tr.total td { font-weight: 700; border-bottom: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  input[type="text"], input[type="number"], input[type="time"], input[type="tel"], select, textarea {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); min-width: 0;
  }
  textarea { min-height: 88px; resize: vertical; }
  .rp { position: relative; }
  .rp > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  .rp input { padding-left: 38px; }
  .chk { display: flex; gap: 8px; align-items: center; min-height: 32px; font-size: 13px; color: var(--ink-2); }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .switch { display: inline-flex; align-items: center; gap: 10px; }
  .switch button {
    width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--axis); position: relative; padding: 0; flex: none;
  }
  .switch button::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s;
  }
  .switch button[aria-checked="true"] { background: var(--accent); }
  .switch button[aria-checked="true"]::after { transform: translateX(18px); }
  .bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 999px; }
  .hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .hbar .trk { height: 14px; display: flex; }
  .hbar .trk i { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .callout { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; border-radius: 10px; padding: 8px 10px; }
  .callout svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .callout.good { background: var(--good-soft); color: var(--good-ink); }
  .callout.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .callout.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .callout.info { background: var(--accent-soft); color: var(--accent-text); }
  .notes { font-size: 12px; color: var(--muted); }

  /* Roster */
  .roster td, .roster th { padding: 4px; text-align: center; }
  .roster td.name { text-align: left; padding-left: 8px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .roster th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .roster .grp td { background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; text-align: left; padding: 6px 8px; }
  .cell {
    width: 100%; min-width: 46px; min-height: 36px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--muted);
  }
  .cell.P { background: var(--c-p); color: var(--accent-text); }
  .cell.S { background: var(--c-s); color: var(--warn-ink); }
  .cell.M { background: var(--c-m); color: var(--good-ink); }
  .cell.PL, .cell.SL, .cell.L, .cell.F { background: var(--c-long); color: var(--ink); border-color: var(--line); }
  .cell.CUTI { background: var(--bad-soft); color: var(--bad-ink); }
  .checks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
  .checks > div { text-align: center; font-size: 11px; border-radius: 8px; padding: 4px 2px; }
  .checks .ok { background: var(--good-soft); color: var(--good-ink); }
  .checks .no { background: var(--warn-soft); color: var(--warn-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); }
  .legend b { font-weight: 600; color: var(--ink); }

  .selfie { width: 72px; height: 72px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); flex: none; }
  .selfie svg { width: 30px; height: 30px; }
  .stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .stepper > div { font-size: 11px; text-align: center; padding: 6px 2px; border-radius: 8px; background: var(--surface-2); color: var(--muted); overflow-wrap: anywhere; }
  .stepper > div.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .stepper > div.done { background: var(--good-soft); color: var(--good-ink); }

  /* Jadwal pasien */
  .bk-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bk-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .bk-day { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 0; min-height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .bk-day span { font-size: 11px; color: var(--muted); }
  .bk-day b { font-family: var(--font-display); font-size: 16px; line-height: 1.3; }
  .bk-day small { font-size: 11px; color: var(--ink-2); }
  .bk-day.today b::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-left: 3px; vertical-align: middle; }
  .bk-day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .bk-day[aria-pressed="true"] span, .bk-day[aria-pressed="true"] small { color: var(--on-accent); }
  .bk-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .bk-chip { flex: none; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
  .bk-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .bk-scroll { overflow: auto; max-height: min(68vh, 600px); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .bk-grid { display: grid; position: relative; width: 100%; }
  .bk-corner, .bk-head { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bk-corner { left: 0; z-index: 5; grid-column: 1; grid-row: 1; }
  .bk-head { display: flex; flex-direction: column; padding: 6px 6px 5px; min-width: 0; border-left: 1px solid var(--grid); }
  .bk-head b { font-size: 13px; line-height: 1.3; }
  .bk-head small { font-size: 11px; color: var(--muted); line-height: 1.25; }
  .bk-time { position: sticky; left: 0; z-index: 3; grid-column: 1; background: var(--surface); border-top: 1px solid var(--grid); padding: 2px 6px 0 0; text-align: right; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .bk-time.half { color: var(--muted); }
  .bk-off, .bk-free { min-width: 0; border: 0; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); border-radius: 0; }
  .bk-off { background: var(--surface-2); opacity: 0.7; }
  .bk-gap { min-width: 0; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); background: var(--surface-2); opacity: 0.45; }
  .bk-free { background: var(--surface); color: var(--axis); font-size: 18px; line-height: 1; padding: 0; }
  .bk-free:hover, .bk-free:focus-visible { background: var(--accent-soft); color: var(--accent-text); }
  .bk-card { position: relative; z-index: 1; margin: 2px 3px; padding: 4px 8px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1px; text-align: left; border-radius: 8px; border: 1px solid var(--line); border-left: 4px solid var(--axis); background: var(--surface-2); color: var(--ink); }
  .bk-card:hover { filter: brightness(0.97); }
  .bk-card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .bk-card[data-drag] { cursor: grab; }
  .bk-card.dragging { opacity: 0.4; cursor: grabbing; }
  .bk-ghost { position: absolute; z-index: 2; box-sizing: border-box; pointer-events: none; padding: 3px 6px; overflow: hidden; border-radius: 8px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 600; line-height: 1.3; }
  .bk-ghost small { display: block; font-weight: 500; font-size: 11px; }

    who: ['Front desk', 'Terapis'],
    build: function (el) {

        return B.who === 't:' + p.id;
      };

      var freeRanges = function (w) {
        var busy = {}, out = [], cur = null, m;
        B.list.forEach(function (b) { if (b.date === B.date && b.th === w.p.id && bkActive(b)) { for (var k = b.t; k < b.t + b.dur; k += BK_SLOT) { busy[k] = true; } } });
        for (m = w.s; m < w.e; m += BK_SLOT) {
          if (busy[m]) { cur = null; continue; }
          if (!cur) { cur = { s: m, e: m + BK_SLOT, w: w }; out.push(cur); } else { cur.e = m + BK_SLOT; }
        }
        return out;

    with: 'Semua laporan Tahap 1 keluar dari data jadwal, booking, dan absen yang sama. Lembur front desk dan potongan telat sudah terhitung, dan semuanya bisa dilihat kapan saja lalu diunduh.',
    who: ['Owner', 'Finance', 'Leader'],
    build: function (el) {
      var tab = initTab('t1r', 'booking');
      var F = { range: 'today', th: 'all', pst: 'all' };
      var reps = {};
      var REASON = ['Pasien berhalangan', 'Minta pindah jadwal', 'Sedang sakit', 'Terapis berhalangan', 'Ada keperluan mendadak'];
      var inRange = function (b) {
        if (F.range === 'today') { return b.date === BK_TODAY; }
        if (F.range === 'week') { return b.date >= '2026-11-16' && b.date <= '2026-11-22'; }
        return true;
      };
      var rowBk = function (b) {
        return [bkLong(b.date), fromMin(b.t) + '-' + fromMin(b.t + b.dur), b.name, BK_SERVICES[b.sv].n, byId(b.th).n, bkCatTag(b) || 'Umum', { html: bkBadge(b.st, true), text: BK_STATUS[b.st].n }];
      };
      var bySort = function (a, b) { return a.date === b.date ? a.t - b.t : (a.date < b.date ? -1 : 1); };

      var bookingHtml = function () {
        var list = S.booking.list.filter(function (b) { return inRange(b) && (F.th === 'all' || b.th === F.th); }).sort(bySort);
        var c = function (st) { return list.filter(function (b) { return b.st === st; }).length; };
        reps.booking = { name: 'laporan-booking.xlsx', rep: { head: ['Tanggal', 'Jam', 'Pasien', 'Layanan', 'Terapis', 'Kategori', 'Status'], rows: list.map(rowBk) } };
        var ths = PEOPLE.filter(function (p) { return p.role === 'T'; });
        return '<div class="ctrl">' + seg('range', [['today', 'Hari ini (17 Nov)'], ['week', '16-22 Nov'], ['all', '16-25 Nov']], F.range) +
          '<div class="field"><label for="f-th">Terapis</label><select id="f-th"><option value="all">Semua terapis</option>' + ths.map(function (p) { return '<option value="' + p.id + '"' + (F.th === p.id ? ' selected' : '') + '>' + p.n + '</option>'; }).join('') + '</select></div></div>' +
          '<div class="grid2">' + tile('Total janji', list.length) + tile('Menunggu / terkonfirmasi', c('PENDING') + c('CONFIRMED')) +
          tile('Sudah datang / selesai', c('CHECKED_IN') + c('DONE')) + tile('Batal / tidak datang', c('CANCELED') + c('NO_SHOW')) + '</div>' +
          repTable(reps.booking.rep, true) + '<div class="row">' + dlBtn('booking') + '</div>' +
          '<p class="notes">Daftar ini diambil dari kalender jadwal pasien, jadi tidak ada input ulang. Status diperbarui front desk di kalender.</p>';
      };

      var pendingHtml = function () {
        var want = F.pst === 'all' ? ['PENDING', 'CANCELED', 'NO_SHOW'] : [F.pst];
        var list = S.booking.list.filter(function (b) { return want.indexOf(b.st) > -1; }).sort(bySort);
        var all = S.booking.list;
        var n = function (st) { return all.filter(function (b) { return b.st === st; }).length; };
        var why = function (b) {
          if (b.st === 'PENDING') { return 'Belum membalas konfirmasi'; }
          if (b.st === 'NO_SHOW') { return 'Tidak datang, tanpa kabar'; }
          return REASON[(parseInt(b.id.slice(1), 10) * 7) % REASON.length];
        };
        reps.pending = { name: 'laporan-pending-batal.xlsx', rep: { head: ['Tanggal', 'Jam', 'Pasien', 'WhatsApp', 'Terapis', 'Status', 'Keterangan', 'Tindak lanjut'], rows: list.map(function (b) {
          return [bkLong(b.date), fromMin(b.t), b.name, b.wa, byId(b.th).n, { html: bkBadge(b.st, true), text: BK_STATUS[b.st].n }, why(b),
            b.st === 'PENDING' ? { html: '<button type="button" class="btn sm" data-wa="' + b.id + '">Kirim pengingat</button>', text: 'Kirim pengingat' } : (b.st === 'CANCELED' ? 'Jam sudah kosong lagi' : 'Hubungi pasien')];
        }) } };
        return '<div class="grid3">' + tile('Menunggu konfirmasi', n('PENDING')) + tile('Batal', n('CANCELED')) + tile('Tidak datang', n('NO_SHOW')) + '</div>' +
          '<div class="ctrl">' + seg('pst', [['all', 'Semua'], ['PENDING', 'Menunggu'], ['CANCELED', 'Batal'], ['NO_SHOW', 'Tidak datang']], F.pst) + '</div>' +
          repTable(reps.pending.rep, true) + '<div class="row">' + dlBtn('pending') + '</div>' +
          '<p class="notes">Ketuk Kirim pengingat untuk menyiapkan pesan WhatsApp ke pasien yang belum konfirmasi. Alasan batal dicatat front desk saat mengubah status.</p>';
      };

      var absenHtml = function () {
        var rows = attendRows(PERIOD_START, BK_TODAY, false);
        var sched = sumBy(rows, function (r) { return r.sched; }), hadir = sumBy(rows, function (r) { return r.hadir; });
        reps.absensi = { name: 'laporan-absensi.xlsx', rep: { head: ['Nama', 'Jabatan', 'Terjadwal', 'Hadir', 'Cuti', 'Izin / sakit', 'Telat (kali)', 'Menit telat', 'Jam kerja'], num: [2, 3, 4, 5, 6, 7, 8],
          rows: rows.map(function (r) { return [r.p.n, ROLE_NAME[r.p.role], r.sched, r.hadir, r.cuti || '-', r.izin || '-', r.late || '-', r.lateMin || '-', hm(r.mins)]; }),
          total: ['Total', '', sched, hadir, sumBy(rows, function (r) { return r.cuti; }), sumBy(rows, function (r) { return r.izin; }), sumBy(rows, function (r) { return r.late; }), sumBy(rows, function (r) { return r.lateMin; }), hm(sumBy(rows, function (r) { return r.mins; }))] } };
        return '<div class="sec-title">Absensi · 26 Okt-17 Nov 2026 (periode berjalan)</div>' +
          '<div class="grid3">' + tile('Kehadiran', pct(hadir, sched)) + tile('Telat (kali)', sumBy(rows, function (r) { return r.late; })) + tile('Cuti / izin (hari)', sumBy(rows, function (r) { return r.cuti + r.izin; })) + '</div>' +
          repTable(reps.absensi.rep, false) + '<div class="row">' + dlBtn('absensi') + '</div>' +
          '<p class="notes">Absen lewat HP dengan lokasi dan selfie. Terlambat dihitung bila masuk lebih dari 10 menit dari jam shift. Jam kerja dikurangi menit terlambat.</p>';
      };

      var cutiHtml = function () {
        var rows = PEOPLE.map(function (p) {
          if (!cutiApplies(p)) { return [p.n, p.st, 'Tidak berlaku', '-', '-', '-']; }
          var u = cutiUsed(p);
          return [p.n, p.st, CUTI_QUOTA + ' hari', u.before, u.now || '-', { html: '<b>' + u.sisa + ' hari</b>', text: u.sisa + ' hari' }];
        });
        var log = cutiEvents().sort(function (a, b) { return a.iso < b.iso ? -1 : 1; });
        reps.cuti = { name: 'laporan-cuti.xlsx', rep: { head: ['Karyawan', 'Status', 'Kuota', 'Terpakai sebelum periode', 'Periode ini', 'Sisa'], num: [3, 4, 5], rows: rows } };
        reps.cutilog = { name: 'riwayat-cuti.xlsx', rep: { head: ['Tanggal cuti', 'Karyawan', 'Pengganti', 'Status'], rows: log.map(function (e) {
          return [fdate(e.iso, true), byId(e.id).n, byId(e.sub).n, { html: chip('good', e.live ? 'Disetujui owner (baru)' : 'Disetujui owner', 'check'), text: 'Disetujui owner' }];
        }) } };
        return '<div class="sec-title">Saldo cuti per karyawan</div>' + repTable(reps.cuti.rep, false) + '<div class="row">' + dlBtn('cuti') + '</div>' +
          '<div class="sec-title">Riwayat cuti periode ini</div>' + repTable(reps.cutilog.rep, false) + '<div class="row">' + dlBtn('cutilog', 'Unduh riwayat cuti (.xlsx)') + '</div>' +
          callout('info', 'check', 'Kuota cuti ' + CUTI_QUOTA + ' hari per tahun untuk karyawan tetap dan kontrak. Cuti hanya bisa diajukan dengan pengganti yang sudah setuju, lalu disetujui owner. Saat disetujui, jadwal berubah dan uang harian shift itu pindah ke pengganti.') +
          '<p class="notes">Coba ajukan dan setujui cuti di layar Jadwal shift dan cuti. Hasilnya langsung muncul di riwayat dan mengurangi sisa kuota di sini.</p>';
      };

      var lemburHtml = function () {
        var fd = fdGaji();
        reps.lembur = { name: 'laporan-lembur-frontdesk.xlsx', rep: { head: ['Front desk', 'Jam kerja', 'Batas jam', 'Kelebihan', 'Tarif per jam', 'Lembur'], num: [1, 2, 3, 4, 5],
          rows: fd.map(function (x) { return [x.p.n, hm(x.G.menit), x.G.batas + ':00', hm(x.calc.over), rp(x.calc.rate), rp(x.calc.lembur)]; }),
          total: ['Total', '', '', '', '', rp(sumBy(fd, function (x) { return x.calc.lembur; }))] } };
        var ev = lateEvents(PERIOD_START, BK_TODAY);
        reps.telat = { name: 'laporan-telat.xlsx', rep: { head: ['Tanggal', 'Karyawan', 'Jadwal masuk', 'Absen masuk', 'Terlambat (menit)', 'Kejadian ke-', 'Potongan'], num: [2, 3, 4, 5, 6],
          rows: ev.map(function (e) { return [fdate(e.iso, false), byId(e.id).n, e.sched, e.at, e.m, e.nth, rp(e.pot)]; }),
          total: ['Total', '', '', '', sumBy(ev, function (e) { return e.m; }), ev.length, rp(sumBy(ev, function (e) { return e.pot; }))] } };
        return '<div class="sec-title">Lembur front desk · periode 26 Okt-25 Nov (draf)</div>' + repTable(reps.lembur.rep, false) + '<div class="row">' + dlBtn('lembur') + '</div>' +
          '<p class="notes">Tarif per jam = gaji pokok ÷ 173. Lembur dihitung bila jam kerja satu periode melebihi batas jam yang diisi finance, dibulatkan ke bawah ke ribuan. Shift long (12 jam) otomatis menambah jam kerja. Angka Kirana sama dengan slip gajinya.</p>' +
          '<div class="sec-title" style="margin-top:6px">Keterlambatan · 26 Okt-17 Nov</div>' + repTable(reps.telat.rep, false) + '<div class="row">' + dlBtn('telat') + '</div>' +
          '<p class="notes">Toleransi 10 menit. Kejadian ke-1 sampai ke-3 dipotong Rp20.000, ke-4 dan seterusnya Rp40.000, dihitung per karyawan per periode. Tambah kejadian di layar Absen, lalu lihat di sini.</p>';
      };

      var render = function () {
        var body = '<div>' + seg('tab', TABS.t1r, tab) + '</div>' +
          (tab === 'booking' ? bookingHtml() : tab === 'pending' ? pendingHtml() : tab === 'absensi' ? absenHtml() : tab === 'cuti' ? cutiHtml() : lemburHtml());
        el.innerHTML = frame('Laporan jadwal', 'Owner dan finance', body, 'wide');
      };
      render();
      el.addEventListener('change', function (e) { if (e.target.id === 'f-th') { F.th = e.target.value; render(); } });
      el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('button') : null; if (!t) { return; }
        var sg = t.getAttribute('data-seg');
        if (sg === 'tab') { tab = t.getAttribute('data-v'); render(); return; }
        if (sg === 'range') { F.range = t.getAttribute('data-v'); render(); return; }
        if (sg === 'pst') { F.pst = t.getAttribute('data-v'); render(); return; }
        var xl = t.getAttribute('data-xl');
        if (xl && reps[xl]) { downloadXlsx(reps[xl].name, repRows(reps[xl].rep)); return; }
        var wa = t.getAttribute('data-wa');
        if (wa) { var b = bkFind(wa); toast('Pesan konfirmasi siap dikirim ke ' + b.name + ' (' + b.wa + '). Tercatat siapa dan kapan.'); }
      });
    }
  });

  /* =====================================================================
     TAHAP 2a: Layanan, diagnosa, paket, invoice, pembayaran, kuitansi, notif suara
     ===================================================================== */
  var PKG_NAME = { '1': 'Single Visit', '3': 'Paket 3', '6': 'Paket 6', '12': 'Paket 12' };
  var PROMO_T2 = { '3': [], '6': [{ id: 'p6', n: 'Promo awal bulan', off: 100000 }], '12': [{ id: 'p12', n: 'Promo November', off: 200000 }] };

    document.body.classList.add('printing');
    var done = function () { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    try { window.print(); } catch (e) { done(); toast('Cetak tidak didukung di browser ini.'); }
  }
  function receiptHtml(r) {
    var cb = function (on, label, sq) { return '<span class="cb' + (on ? ' on' : '') + (sq ? ' sq' : '') + '"><i></i>' + esc(label) + '</span>'; };

      line('Fisioterapis', r.th) + line('Note', r.note || '-') + line('Diagnosa', r.dx || '-') +
      '<div class="cbs"><b>Pembayaran / Payment:</b>' + cb(r.pay === 'tunai', 'Cash') + cb(r.pay === 'transfer' || r.pay === 'qris', 'Transfer') + cb(card, 'Debit') + '</div>' +
      '<div class="cbs">' + cb(r.pkg === '1' && !r.hv, 'Single Visit', true) + cb(r.pkg === '3', '3 Cares', true) + cb(r.pkg === '6', '6 Cares', true) + cb(r.pkg === '12', '12 Cares', true) + cb(r.hv, 'Home Visit', true) + '</div>' +
      '<div class="tot"><span>Total</span><span class="num">' + rp(r.total) + '</span></div>' +
      '<div class="sig">Salam Hormat / Yours Sincerely<br><br><br><span>Front desk ' + esc(r.fd) + '</span></div></div>';
  }

  add({
    id: 't2a', title: 'Dari pasien datang sampai kuitansi, dan pembayaran masuk berbunyi',
    now: 'Kuitansi ditulis tangan di formulir Tanda Terima Pembayaran, lalu penjualan diketik ulang ke Excel harian. Finance baru tahu rinciannya setelah laporan harian masuk.',
    with: 'Satu alur di sistem: pilih pasien baru atau regular, jenis layanan dan diagnosa, paket, lalu invoice, pembayaran, dan kuitansi. Begitu pembayaran dicatat, notifikasi suara berbunyi dan penjualan langsung masuk ke daftar dan laporan.',
    who: ['Front desk', 'Finance', 'Owner'],
    build: function (el) {
      var D = S.svc;
      var invCalc = function () {
        var hv = D.loc === 'hv', pk = hv ? '1' : D.pkg, lines = [];
        if (hv) { lines.push({ n: 'Home visit (90 menit)', amt: PRICE.hv }); }
        else if (pk === '1') { lines.push({ n: 'Single Visit (per kedatangan)', amt: PRICE.sv }); }
        else { lines.push({ n: PKG_NAME[pk] + ', harga normal', amt: PRICE['p' + pk] }); }
        D.tind.forEach(function (k) {
          var t = TINDAKAN.filter(function (x) { return x[0] === k; })[0];
          if (t && t[2]) { lines.push({ n: 'Tambahan: ' + t[1], amt: t[2] }); }
        });
        var promo = (!hv && pk !== '1') ? (PROMO_T2[pk].filter(function (p) { return p.id === D.promo; })[0] || null) : null;
        var sub = sumBy(lines, function (l) { return l.amt; });
        return { lines: lines, promo: promo, sub: sub, total: sub - (promo ? promo.off : 0), pk: pk, hv: hv };
      };
      var linesTable = function (c) {
        return '<div class="tablewrap"><table><tbody>' + c.lines.map(function (l) { return '<tr><td class="wrap">' + esc(l.n) + '</td><td class="r num">' + rp(l.amt) + '</td></tr>'; }).join('') +
          (c.promo ? '<tr><td class="wrap">' + esc(c.promo.n) + '</td><td class="r num">' + rp(-c.promo.off) + '</td></tr>' : '') +
          '<tr class="total"><td>Total ditagih</td><td class="r num">' + rp(c.total) + '</td></tr></tbody></table></div>';
      };
      var stepper = function () {
        var names = ['1 Pasien dan layanan', '2 Invoice', '3 Pembayaran', '4 Kuitansi'];
        return '<div class="stepper">' + names.map(function (n, i) { return '<div class="' + (i < D.step ? 'done' : (i === D.step ? 'on' : '')) + '">' + n + '</div>'; }).join('') + '</div>';
      };
      var formHtml = function () {
        var c = invCalc(), hv = D.loc === 'hv';
        var left =
          '<div class="panel"><div class="sec-title" style="margin-bottom:8px">Pasien</div>' +
          seg('type', [['baru', 'Pasien baru'], ['reg', 'Pasien regular']], D.type) +
          '<div class="grid2" style="margin-top:10px"><div class="field"><label for="sv-name">Nama pasien</label><input type="text" id="sv-name" value="' + esc(D.name) + '" autocomplete="off"></div>' +
          '<div class="field"><label for="sv-th">Fisioterapis</label><select id="sv-th">' + TERAPIS_PICK.map(function (n) { return '<option' + (n === D.th ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div></div>' +
          '<p class="notes" style="margin-top:6px">' + (D.type === 'baru' ? 'Pasien baru dihitung sebagai New Pasien di laporan, dan insentif pasien baru masuk ke front desk yang bertugas.' : 'Pasien regular: riwayat kunjungan dan sisa paket sudah ada di sistem.') + '</p></div>' +
          '<div class="panel"><div class="sec-title" style="margin-bottom:8px">Jenis layanan</div>' + seg('loc', [['klinik', 'Di klinik'], ['hv', 'Home visit']], D.loc) +
          '<div class="tchk" style="margin-top:10px">' + TINDAKAN.map(function (t) {
            return '<label class="chk"><input type="checkbox" data-tind="' + t[0] + '"' + (D.tind.indexOf(t[0]) > -1 ? ' checked' : '') + '> ' + esc(t[1]) + (t[2] ? ' <span class="muted">(+' + rp(t[2]) + ')</span>' : '') + '</label>';
          }).join('') + '</div><p class="notes" style="margin-top:6px">Tindakan dasar sudah termasuk di tarif per kedatangan. Kinesiotape, ESWT, dan sport massage ditagih tambahan.</p></div>' +
          '<div class="panel"><div class="sec-title" style="margin-bottom:8px">Note dan diagnosa</div>' +
          '<div class="field"><label for="sv-note">Note</label><input type="text" id="sv-note" value="' + esc(D.note) + '" autocomplete="off"></div>' +
          '<div class="field" style="margin-top:8px"><label for="sv-dx">Diagnosa</label><input type="text" id="sv-dx" value="' + esc(D.dx) + '" placeholder="Contoh: Nyeri punggung" autocomplete="off"></div>' +
          '<p class="notes" style="margin-top:6px">Dua baris ini sama seperti di formulir kuitansi sekarang (Note dan Diagnosa): diisi bebas, lalu tampil di kuitansi.</p></div>';
        var right =
          '<div class="panel"><div class="sec-title" style="margin-bottom:8px">Paket layanan</div>' +
          seg('pkg', [['1', 'Single Visit'], ['3', 'Paket 3'], ['6', 'Paket 6'], ['12', 'Paket 12']], hv ? '1' : D.pkg) +
          (hv ? '<p class="notes" style="margin-top:8px">Home visit dibayar per kunjungan, jadi paket tidak berlaku.</p>' : '') +
          (!hv && D.pkg !== '1' ? '<div class="field" style="margin-top:10px"><label for="sv-promo">Promo yang berlaku</label><select id="sv-promo"><option value="">Tanpa promo (harga normal)</option>' +
            PROMO_T2[D.pkg].map(function (p) { return '<option value="' + p.id + '"' + (p.id === D.promo ? ' selected' : '') + '>' + esc(p.n) + ' (potongan ' + rp(p.off) + ')</option>'; }).join('') + '</select>' +
            (PROMO_T2[D.pkg].length ? '' : '<small class="muted">Tidak ada promo aktif untuk paket ini.</small>') + '</div>' : '') + '</div>' +
          '<div class="panel"><div class="sec-title" style="margin-bottom:6px">Harga dari sistem</div>' + linesTable(c) +
          '<p class="notes" style="margin-top:6px">Harga dan promo diambil dari daftar harga yang dibuat owner atau finance. Front desk tidak mengetik harga sendiri.</p>' +
          '<div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="mk-inv">Buat invoice</button></div></div>';
        return '<div class="tgrid"><div>' + left + '</div><div>' + right + '</div></div>';
      };
      var invoiceHtml = function () {
        var I = D.inv, c = I.calc;
        return '<div class="invoice"><div class="hd"><div><b style="font-size:16px">INVOICE</b><div class="muted">' + esc(I.no) + '</div></div>' +
          '<div style="text-align:right"><div>' + esc(I.date) + ' · ' + esc(fromMin(I.clock)) + '</div><div class="muted">Front desk Laras</div></div></div>' +
          '<div class="row" style="margin-top:10px"><b>' + esc(I.name) + '</b>' + chip('info', I.type === 'baru' ? 'New Pasien' : 'Regular') + chip('', c.hv ? 'Home Visit' : PKG_NAME[c.pk]) + '</div>' +
          '<div class="muted" style="font-size:12px;margin-top:4px">Fisioterapis ' + esc(I.th) + ' · Diagnosa: ' + esc(I.dx || '-') + '</div>' +
          '<div style="margin-top:10px">' + linesTable(c) + '</div><div class="row" style="margin-top:8px">' + chip('warn', 'Belum dibayar', 'clock') + '</div></div>' +
          '<div class="row"><button type="button" class="btn" data-act="back0">Ubah data</button><button type="button" class="btn primary" data-act="to-pay">Lanjut: terima pembayaran</button></div>';
      };
      var payHtml = function () {
        var I = D.inv;

      var daftarHtml = function () {
        var rows = visList(), all = lostList(), nSel = selVisible().length, elig = rows.filter(eligible);
        var allOn = elig.length > 0 && elig.every(function (p) { return D.sel[p.id]; });
        reps.list = { name: 'pasien-tidak-kembali-' + D.m + '-bulan.xlsx', rep: { head: ['Pasien', 'WhatsApp', 'Terakhir datang', 'Hari sejak terakhir', 'Total kunjungan', 'Layanan terakhir', 'Sisa paket (sesi)', 'Fisioterapis terakhir', 'Diagnosa terakhir', 'Setuju info promo', 'Status WhatsApp'], num: [3, 4, 6], rows: listRows(rows) } };
        var head = '<tr><th><input type="checkbox" data-selall aria-label="Pilih semua yang bisa dihubungi"' + (allOn ? ' checked' : '') + '></th><th>Pasien</th><th>Terakhir datang</th><th class="r">Kunjungan</th><th>Layanan terakhir</th><th class="r">Sisa paket</th><th>Fisio · diagnosa</th><th>Status WhatsApp</th><th></th></tr>';
        var body = rows.map(function (p) {
          var st = p.sent ? chip('good', 'Promo terkirim ' + p.sent.d, 'check') : (p.consent ? chip('warn', 'Belum dihubungi') : chip('', 'Tidak setuju info'));
          return '<tr' + (p.live ? ' class="hl"' : '') + '><td>' + (eligible(p) ? '<input type="checkbox" data-sel="' + p.id + '" aria-label="Pilih ' + esc(p.name) + '"' + (D.sel[p.id] ? ' checked' : '') + '>' : '') + '</td>' +
            '<td><b>' + esc(p.name) + '</b><div class="muted" style="font-size:12px">' + esc(p.wa) + '</div></td>' +
            '<td>' + retDmy(p.last) + '<div class="muted" style="font-size:12px">' + retLama(retDays(p.last)) + ' lalu</div></td>' +
            '<td class="r num">' + p.visits + '</td><td>' + KIND[p.kind] + '</td><td class="r num">' + (RET_SIZE[p.kind] ? (p.left ? p.left + ' sesi' : 'Habis') : '-') + '</td>' +
            '<td>' + esc(p.th) + '<div class="muted" style="font-size:12px">' + esc(p.dx) + '</div></td><td>' + st + '</td>' +
            '<td>' + (eligible(p) ? '<button type="button" class="btn sm" data-send1="' + p.id + '">Kirim WA</button>' : '') + '</td></tr>';
        }).join('') || '<tr><td colspan="9" class="muted">Tidak ada pasien untuk pilihan ini.</td></tr>';
        return segM() +
          '<div class="ctrl">' + seg('f', [['all', 'Semua (' + all.length + ')'], ['paket', 'Paket belum habis (' + all.filter(function (p) { return p.left > 0; }).length + ')'], ['todo', 'Belum dihubungi (' + all.filter(eligible).length + ')']], D.f) + '</div>' +
          '<p class="notes">' + esc(cutoffTxt()) + ' Terurut dari yang paling baru berhenti datang, karena paling mudah diajak kembali.</p>' +
          '<div class="scroll-y"><div class="tablewrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>' +
          '<div class="row"><button type="button" class="btn primary" data-act="sendsel"' + (nSel ? '' : ' disabled') + '>Kirim promo ke ' + nSel + ' pasien terpilih</button><button type="button" class="btn sm" data-xl="list">Unduh daftar ini (.xlsx)</button></div>' +
          '<p class="notes">Pasien dikenali dari nomor WhatsApp yang diinput saat booking, jadi nama yang tertulis berbeda tetap dihitung satu orang. Pasien yang tidak setuju menerima info promo tidak bisa dipilih, dan pasien yang sudah dikirimi promo tidak ikut terpilih lagi supaya tidak dikirimi berulang. Ini contoh, tidak ada pesan sungguhan yang terkirim.</p>';
      };

      var render = function () {
        var body = '<div>' + seg('tab', TABS.ret, tab) + '</div>' + (tab === 'review' ? reviewHtml() : daftarHtml());
        el.innerHTML = frame('Pasien tidak kembali', 'Owner dan front desk', body, 'wide');
      };

      var openSend = function (ids) {
        var pts = ids.map(function (id) { return D.pts.filter(function (p) { return p.id === id; })[0]; }).filter(function (p) { return p && eligible(p); });
        if (!pts.length) { toast('Pilih pasien dulu.'); return; }
        modal('<div id="rt-mb"></div>', function (o, close) {
          var st = { tpl: RET_TPL[0].id, txt: RET_TPL[0].txt };
          var tplOf = function () { return RET_TPL.filter(function (t) { return t.id === st.tpl; })[0]; };
          var recip = function () { return pts.filter(function (p) { return !tplOf().need || p.left > 0; }); };
          var msgFor = function (p) { return st.txt.replace(/\{nama\}/g, p.name).replace(/\{sisa\}/g, String(p.left)); };
          var pv = function () {
            var r = recip(), first = r[0];
            o.querySelector('#rt-pv').innerHTML = first ? '<b>Contoh untuk ' + esc(first.name) + ' (' + esc(first.wa) + ')</b><div style="white-space:pre-wrap;margin-top:4px">' + esc(msgFor(first)) + '</div>' : 'Tidak ada penerima yang cocok dengan pesan ini.';
            o.querySelector('#rt-n').textContent = r.length + ' pasien akan menerima pesan' + (r.length < pts.length ? ', ' + (pts.length - r.length) + ' dilewati karena tidak punya sisa paket' : '');
            o.querySelector('[data-act="rt-send"]').disabled = !r.length;
          };
          var draw = function () {
            o.querySelector('#rt-mb').innerHTML = '<h3>Kirim promo via WhatsApp</h3>' +
              '<div class="field"><label for="rt-tpl">Isi pesan</label><select id="rt-tpl">' + RET_TPL.map(function (t) { return '<option value="' + t.id + '"' + (t.id === st.tpl ? ' selected' : '') + '>' + esc(t.n) + '</option>'; }).join('') + '</select></div>' +
              '<div class="field" style="margin-top:8px"><label for="rt-txt">Teks pesan (bisa diubah, {nama} diganti nama pasien)</label><textarea id="rt-txt" rows="5">' + esc(st.txt) + '</textarea></div>' +
              '<div class="panel soft" style="margin-top:8px" id="rt-pv"></div><p class="notes" id="rt-n" style="margin-top:6px"></p>' +
              '<div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="rt-send">Kirim ke WhatsApp</button><button type="button" class="btn" data-close>Batal</button></div>';
            pv();
          };
          draw();
          o.addEventListener('change', function (e) { if (e.target.id === 'rt-tpl') { st.tpl = e.target.value; st.txt = tplOf().txt; draw(); } });
          o.addEventListener('input', function (e) { if (e.target.id === 'rt-txt') { st.txt = e.target.value; pv(); } });
          o.addEventListener('click', function (e) {
            var b = e.target.closest ? e.target.closest('button') : null;
            if (!b || b.getAttribute('data-act') !== 'rt-send') { return; }
            var r = recip(); if (!r.length) { return; }
            r.forEach(function (p) { p.sent = { d: '17 Nov', t: tplOf().n }; p.live = true; delete D.sel[p.id]; });
            close(); render();
            toast(r.length + ' pesan promo masuk antrean WhatsApp. Ini contoh, tidak ada pesan sungguhan yang terkirim.');
          });
        });
      };

      render();
      el.addEventListener('change', function (e) {
        var t = e.target, id = t.getAttribute && t.getAttribute('data-sel');
        if (id) { if (t.checked) { D.sel[id] = true; } else { delete D.sel[id]; } render(); return; }
        if (t.getAttribute && t.hasAttribute('data-selall')) {
          visList().filter(eligible).forEach(function (p) { if (t.checked) { D.sel[p.id] = true; } else { delete D.sel[p.id]; } });
          render();
        }
      });
      el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('button') : null; if (!t) { return; }
        var sg = t.getAttribute('data-seg'), v = t.getAttribute('data-v'), act = t.getAttribute('data-act');
        if (sg === 'tab') { tab = v; render(); return; }
        if (sg === 'm') { D.m = v; render(); return; }
        if (sg === 'f') { D.f = v; render(); return; }
        var xl = t.getAttribute('data-xl');
        if (xl && reps[xl]) { downloadXlsx(reps[xl].name, repRows(reps[xl].rep)); return; }
        if (t.getAttribute('data-send1')) { openSend([t.getAttribute('data-send1')]); return; }
        if (act === 'sendsel') { openSend(selVisible().map(function (p) { return p.id; })); return; }
      });
    }
  });

  /* ---------- Urutan presentasi: satu periode kerja, dengan satu hari penuh di tengahnya ---------- */
  var BAB = [
    { t: 'Awal periode', d: 'Sebelum periode jadwal berjalan, leader menyusun jadwal shift untuk semua karyawan.', ids: ['m2'], w: { m2: 'Sebelum periode dimulai' } },
    { t: 'Satu hari di klinik: Selasa, 17 November', d: 'Dari karyawan masuk di pagi hari sampai laporan dikirim di malam hari. Semua yang terjadi hari ini tercatat sendiri di sistem.', ids: ['m2b', 'm8', 'm10', 'm1', 'm6', 'm7', /* 'm11', */ 'm4', 'm3'],
      w: { m2b: '07:30 · Karyawan masuk', m8: '08:00 · Pengingat untuk pasien hari ini', m10: '09:00 · Pasien baru menghubungi klinik', m1: '11:20 · Owner membuka HP', m6: '14:00 · Pasien selesai terapi', m7: '14:30 · Bonus kunjungan pasien', /* m11: '16:00 · Kebutuhan operasional', */ m4: '19:30 · Penutupan hari dan laporan harian', m3: '20:00 · Owner melihat pemasukan hari ini' } },
    { t: 'Akhir periode dan akhir bulan', d: 'Semua laporan harian yang sudah final menjadi dasar gaji dan laporan bulanan.', ids: ['m5', 'm9'], w: { m5: '25 November · Hari gajian', m9: '30 November · Akhir bulan' } }
  ];
  var ALL = {};
  SCENES.forEach(function (sc) { ALL[sc.id] = sc; });
  (function () {
    var byIdMap = {}; SCENES.forEach(function (sc) { byIdMap[sc.id] = sc; });
    var ordered = [];
    BAB.forEach(function (b) { b.ids.forEach(function (id) { var sc = byIdMap[id]; sc.bab = b.t; sc.waktu = b.w[id]; ordered.push(sc); delete byIdMap[id]; }); });
    var rest = Object.keys(byIdMap).filter(function (id) { return TAHAP_ONLY.indexOf(id) < 0; });
    if (rest.length) { throw new Error('Adegan belum masuk urutan: ' + rest.join(', ')); }
    SCENES.length = 0; ordered.forEach(function (sc) { SCENES.push(sc); });
  })();
  /* Urutan menurut dokumen owner (4 tahap), lalu fitur tambahan. Setiap poin dokumen harus punya layar. */
  var ORDER_TAHAP = ORDER_T.map(function (id) { if (!ALL[id]) { throw new Error('Layar tahap tidak ada: ' + id); } return ALL[id]; });
  TAHAP.forEach(function (th) {
    th.items.forEach(function (it) {
      [it[2]].concat(it[3] || []).forEach(function (spec) { if (!ALL[spec.split(':')[0]]) { throw new Error('Poin ' + it[0] + ' menunjuk layar yang tidak ada: ' + spec); } });
    });
  });

  /* ---------- Router & halaman daftar ---------- */
  var root = $('#root');
  var header = function () {
    return '<div class="demo-bar">' + ic('warn') + '<span>Prototype dengan data contoh. Nama, angka, dan tarif di sini fiktif, dan ini belum sistem yang sebenarnya.</span></div>' +
      '<div class="topbar"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" aria-hidden="true">' + ICON.cross + '</svg></span><span>Sistem Klinik</span></div>' +
      '<a class="btn sm" href="#daftar">Daftar isi</a></div>';
  };
  var FULL_IDS = ['t1r', 't2r', 't3r', 't4r', 'ret'];
  function parseHash() {
    var h = (location.hash || '').replace(/^#/, ''), q = '', i = h.indexOf('?'), o = {};
    if (i >= 0) { q = h.slice(i + 1); h = h.slice(0, i); }
    q.split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) { o[p[0]] = decodeURIComponent(p[1] || ''); } });
    return { id: h || 'daftar', o: o };
  }
  function tahapHtml(th) {
    var firstId = ORDER_T.filter(function (id) { return TH_OF[id] === th.no; })[0];
    return '<section class="tahap"><header><div><span class="n">Tahap ' + th.no + '</span><h2>' + esc(th.t) + '</h2><p>' + esc(th.d) + '</p></div>' +
      '<a class="btn sm primary" href="#' + firstId + '?o=t">Buka tahap ini</a></header>' +
      '<div class="legend"><span class="plink main">Biru</span> layar utama yang menjawab poin <span class="plink">Putih</span> layar terkait, misalnya laporannya</div>' +
      th.items.map(function (it) {
        return '<div class="pitem"><span class="k">' + it[0] + '</span><div class="tx">' + esc(it[1]) + '</div><div class="go"><a class="plink main" href="' + linkHref(it[2]) + '">' + esc(linkLabel(it[2])) + '</a>' +
          (it[3] || []).map(function (s) { return '<a class="plink" href="' + linkHref(s) + '">' + esc(linkLabel(s)) + '</a>'; }).join('') + '</div></div>';
      }).join('') + '</section>';
  }
  function listPage(o) {
    var no = {}; SCENES.forEach(function (sc, i) { no[sc.id] = i + 1; });
    var total = 0; TAHAP.forEach(function (th) { total += th.items.length; });
    var extra = ORDER_T.filter(function (id) { return !TH_OF[id]; }).map(function (id) { return ALL[id]; });
    root.innerHTML = header() +
      '<div class="hero"><h1>Empat tahap yang Anda minta, bisa dicoba satu per satu</h1>' +
      '<p>Setiap poin di daftar Tahap 1 sampai Tahap 4 punya layar yang bisa diklik dan dicoba. Pilih poinnya di bawah, atau ikuti satu hari penuh di klinik di bagian paling bawah.</p>' +
      '<div class="row" style="margin-top:20px"><a class="btn primary" href="#m2?o=t">Mulai dari Tahap 1</a><a class="btn" href="#daftar?s=cerita">Atau ikuti cerita satu hari</a></div>' +
      '<div class="peta-sum">' + chip('good', total + ' dari ' + total + ' poin sudah ada layarnya', 'check') + chip('info', '4 tahap, ' + ORDER_TAHAP.filter(function (s) { return TH_OF[s.id]; }).length + ' layar') + '</div></div>' +
      TAHAP.map(tahapHtml).join('') +
      '<section class="tahap"><header><div><span class="n">Tambahan</span><h2>Di luar daftar 4 tahap</h2><p>Permintaan susulan dan pelengkap yang tidak ada di daftar 4 tahap.</p></div></header>' +
      extra.map(function (sc) {
        return '<div class="pitem"><span class="k">+</span><div class="tx">' + esc(sc.title) + '</div><div class="go"><a class="plink main" href="#' + sc.id + '?o=t">Buka</a></div></div>';
      }).join('') + '</section>' +
      '<div id="cerita">' + BAB.map(function (b, bi) {
        return '<div class="bab"><h2>' + (bi === 0 ? 'Cara lain: ikuti cerita satu hari di klinik. ' : '') + esc(b.t) + '</h2><p>' + esc(b.d) + '</p><div class="cards">' + b.ids.map(function (id) {
          var sc = ALL[id];
          return '<a class="card-link" href="#' + sc.id + '"><span class="n">Masalah ' + no[id] + ' · ' + esc(sc.waktu) + '</span><h3>' + esc(sc.title) + '</h3><span class="a">Sekarang: ' + esc(sc.now) + '</span><span class="b">Dengan sistem: ' + esc(sc.with) + '</span></a>';
        }).join('') + '</div></div>';
      }).join('') + '</div>';
    if (o && o.s === 'cerita') { var c = $('#cerita'); if (c && c.scrollIntoView) { c.scrollIntoView(); } }
  }
  function scenePage(s, mode) {
    var list = mode === 't' ? ORDER_TAHAP : SCENES, i = list.indexOf(s), prev = list[i - 1], next = list[i + 1];
    var q = mode === 't' ? '?o=t' : '';
    var nav = '<div class="scene-nav"><a class="btn sm" href="#daftar">' + ic('left') + ' Semua poin</a><div class="row">' +
      (prev ? '<a class="btn sm" href="#' + prev.id + q + '">' + ic('left') + ' Sebelumnya</a>' : '') +
      '<span class="muted" style="font-size:13px">' + (i + 1) + ' dari ' + list.length + '</span>' +
      (next ? '<a class="btn sm primary" href="#' + next.id + q + '">Berikutnya ' + ic('right') + '</a>' : '') + '</div></div>';
    var th = TH_OF[s.id];
    var tag, sub;
    if (mode === 't') { tag = th ? 'Tahap ' + th + ' · ' + TAHAP[th - 1].t : 'Tambahan di luar daftar'; sub = SHORT[s.id] || ''; }
    else { tag = 'Masalah ' + (i + 1) + ' · ' + s.waktu; sub = s.bab; }
    var keys = SC_ITEMS[s.id] || [];
    var pdfBox = keys.length
      ? '<div class="box pdf"><small>Poin permintaan owner di layar ini</small><ul>' + keys.map(function (k) { return '<li><b>' + k + '</b> ' + esc(pdfItem(k).n) + '</li>'; }).join('') + '</ul></div>'
      : '<div class="box pdf"><small>Tambahan</small>Layar ini tidak ada di daftar 4 tahap. Ditambahkan sebagai permintaan susulan atau pelengkap.</div>';
    root.innerHTML = header() + nav +
      '<div class="scene' + (FULL_IDS.indexOf(s.id) > -1 ? ' full' : '') + '"><div class="story"><span class="tag">' + esc(tag) + '</span><div class="muted" style="font-size:12px">' + esc(sub) + '</div><h2>' + esc(s.title) + '</h2>' +
      '<div class="box before"><small>Sekarang</small>' + esc(s.now) + '</div>' +
      '<div class="box after"><small>Dengan sistem</small>' + esc(s.with) + '</div>' + pdfBox +
      '<div class="row">' + s.who.map(function (w) { return chip('info', w); }).join('') + '<span class="muted" style="font-size:12px">yang melihat layar ini</span></div></div>' +
      '<div class="stage" id="stage-host"></div></div>';
    s.build($('#stage-host'));
  }
  function route() {
    try { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); } } catch (e) { /* abaikan */ }
    var h = parseHash(), sc = ALL[h.id];
    START.tab = h.o.tab || '';
    if (!sc) { listPage(h.o); } else { scenePage(sc, (h.o.o === 't' || SCENES.indexOf(sc) < 0) ? 't' : 's'); }
    if (!(h.id === 'daftar' && h.o.s === 'cerita')) { window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
