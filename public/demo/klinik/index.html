<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prototype Sistem Klinik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
  /* Konsep: cerita per masalah. Kiri: masalah dan hasilnya dalam bahasa owner. Kanan: layar aplikasi yang bisa diklik. */
  :root {
    --bg: #f3f6f7;
    --surface: #ffffff;
    --surface-2: #edf2f4;
    --ink: #0e1a21;
    --ink-2: #44535c;
    --muted: #78868e;
    --line: #dbe2e6;
    --accent: #2a78d6;
    --accent-text: #1c5cab;
    --accent-soft: #e2edfb;
    --on-accent: #ffffff;
    --good: #0ca30c;
    --good-ink: #006300;
    --good-soft: #e3f4e3;
    --warn: #fab219;
    --warn-ink: #7a5200;
    --warn-soft: #fdf1d3;
    --bad: #d03b3b;
    --bad-ink: #a42525;
    --bad-soft: #fbe5e5;
    --series-1: #2a78d6;
    --grid: #e3e8ea;
    --axis: #c3cbd0;
    --c-p: #e2edfb;
    --c-s: #fdf1d3;
    --c-m: #dcf1ec;
    --c-long: #ece8fb;
    --shadow: 0 1px 2px rgba(14, 26, 33, 0.06), 0 8px 24px rgba(14, 26, 33, 0.06);
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1317;
      --surface: #141c22;
      --surface-2: #1b252c;
      --ink: #eaf0f3;
      --ink-2: #b4c1c8;
      --muted: #8a979f;
      --line: #27333b;
      --accent: #3987e5;
      --accent-text: #6da7ec;
      --accent-soft: #162a43;
      --on-accent: #ffffff;
      --good-ink: #3ec43e;
      --good-soft: #14301a;
      --warn-ink: #fab219;
      --warn-soft: #3a2d0c;
      --bad-ink: #ee7a7a;
      --bad-soft: #3a1717;
      --series-1: #3987e5;
      --grid: #232e35;
      --axis: #38454e;
      --c-p: #162a43;
      --c-s: #3a2d0c;
      --c-m: #12332d;
      --c-long: #2a2447;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1317;
    --surface: #141c22;
    --surface-2: #1b252c;
    --ink: #eaf0f3;
    --ink-2: #b4c1c8;
    --muted: #8a979f;
    --line: #27333b;
    --accent: #3987e5;
    --accent-text: #6da7ec;
    --accent-soft: #162a43;
    --on-accent: #ffffff;
    --good-ink: #3ec43e;
    --good-soft: #14301a;
    --warn-ink: #fab219;
    --warn-soft: #3a2d0c;
    --bad-ink: #ee7a7a;
    --bad-soft: #3a1717;
    --series-1: #3987e5;
    --grid: #232e35;
    --axis: #38454e;
    --c-p: #162a43;
    --c-s: #3a2d0c;
    --c-m: #12332d;
    --c-long: #2a2447;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 56px;
  }
  .muted { color: var(--muted); }
  .sub { color: var(--ink-2); }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Banner & header */
  .demo-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--warn-soft); color: var(--warn-ink);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    border-radius: 10px; padding: 8px 12px; font-size: 13px;
  }
  .demo-bar svg { width: 18px; height: 18px; flex: none; }
  svg { max-width: 100%; }
  .topbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 18px 0 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .logo svg { width: 16px; height: 16px; stroke: var(--on-accent); }

  /* Buttons & chips */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink);
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn svg, .chip svg { width: 15px; height: 15px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
  }
  .chip.good { background: var(--good-soft); color: var(--good-ink); }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .chip.info { background: var(--accent-soft); color: var(--accent-text); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; min-height: 36px; font-weight: 500; color: var(--ink-2);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  /* Index */
  .hero h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; font-weight: 800; }
  .hero p { margin-top: 12px; max-width: 62ch; color: var(--ink-2); font-size: 17px; }
  .bab { margin-top: 32px; }
  .bab h2 { font-size: 20px; line-height: 1.25; }
  .bab > p { margin-top: 4px; max-width: 70ch; color: var(--ink-2); font-size: 14px; }
  .bab .cards { margin-top: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-top: 28px; }
  .card-link {
    display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: inherit; min-width: 0;
  }
  .card-link:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .card-link .n { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .card-link h3 { font-size: 17px; line-height: 1.3; }
  .card-link .a { font-size: 13px; color: var(--muted); }
  .card-link .b { font-size: 13px; color: var(--ink-2); }

  /* Scene */
  .scene-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
  .scene { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 28px; align-items: start; }
  .story { display: flex; flex-direction: column; gap: 16px; }
  .story h2 { font-size: clamp(22px, 3vw, 28px); line-height: 1.2; font-weight: 800; }
  .story .tag { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .box { border-radius: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
  .box small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
  .box.before small { color: var(--bad-ink); }
  .box.after small { color: var(--good-ink); }
  .stage { display: flex; justify-content: center; min-width: 0; }
  .app {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
  }
  .app.wide { max-width: 100%; }
  .app-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .app-bar b { font-family: var(--font-display); font-size: 15px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .app-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }
  .panel { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); min-width: 0; }
  .panel.soft { background: var(--surface-2); border-color: transparent; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile .l { font-size: 12px; color: var(--muted); }
  .tile .v { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .hero-fig { font-family: var(--font-display); font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
  .list { display: flex; flex-direction: column; }
  .li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .rowbtn { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; color: inherit; cursor: pointer; min-width: 0; }
  .rowbtn:hover { border-color: var(--series-1); }
  .rowbtn .rb-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rowbtn .rb-main small { color: var(--muted); font-size: 12px; }
  .rowbtn > svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .li .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .li .t small { display: block; color: var(--muted); font-size: 12px; }
  .ava { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  td.r, th.r { text-align: right; }
  tr.total td { font-weight: 700; border-bottom: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  input[type="text"], input[type="number"], input[type="time"], input[type="tel"], select, textarea {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); min-width: 0;
  }
  textarea { min-height: 88px; resize: vertical; }
  .rp { position: relative; }
  .rp > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  .rp input { padding-left: 38px; }
  .chk { display: flex; gap: 8px; align-items: center; min-height: 32px; font-size: 13px; color: var(--ink-2); }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .switch { display: inline-flex; align-items: center; gap: 10px; }
  .switch button {
    width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--axis); position: relative; padding: 0; flex: none;
  }
  .switch button::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s;
  }
  .switch button[aria-checked="true"] { background: var(--accent); }
  .switch button[aria-checked="true"]::after { transform: translateX(18px); }
  .bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 999px; }
  .hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .hbar .trk { height: 14px; display: flex; }
  .hbar .trk i { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .callout { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; border-radius: 10px; padding: 8px 10px; }
  .callout svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .callout.good { background: var(--good-soft); color: var(--good-ink); }
  .callout.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .callout.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .callout.info { background: var(--accent-soft); color: var(--accent-text); }
  .notes { font-size: 12px; color: var(--muted); }

  /* Roster */
  .roster td, .roster th { padding: 4px; text-align: center; }
  .roster td.name { text-align: left; padding-left: 8px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .roster th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .roster .grp td { background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; text-align: left; padding: 6px 8px; }
  .cell {
    width: 100%; min-width: 46px; min-height: 36px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--muted);
  }
  .cell.P { background: var(--c-p); color: var(--accent-text); }
  .cell.S { background: var(--c-s); color: var(--warn-ink); }
  .cell.M { background: var(--c-m); color: var(--good-ink); }
  .cell.PL, .cell.SL, .cell.L, .cell.F { background: var(--c-long); color: var(--ink); border-color: var(--line); }
  .cell.CUTI { background: var(--bad-soft); color: var(--bad-ink); }
  .checks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
  .checks > div { text-align: center; font-size: 11px; border-radius: 8px; padding: 4px 2px; }
  .checks .ok { background: var(--good-soft); color: var(--good-ink); }
  .checks .no { background: var(--warn-soft); color: var(--warn-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); }
  .legend b { font-weight: 600; color: var(--ink); }

  .selfie { width: 72px; height: 72px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); flex: none; }
  .selfie svg { width: 30px; height: 30px; }
  .stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .stepper > div { font-size: 11px; text-align: center; padding: 6px 2px; border-radius: 8px; background: var(--surface-2); color: var(--muted); overflow-wrap: anywhere; }
  .stepper > div.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .stepper > div.done { background: var(--good-soft); color: var(--good-ink); }

  /* Jadwal pasien */
  .bk-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bk-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .bk-day { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 0; min-height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .bk-day span { font-size: 11px; color: var(--muted); }
  .bk-day b { font-family: var(--font-display); font-size: 16px; line-height: 1.3; }
  .bk-day small { font-size: 11px; color: var(--ink-2); }
  .bk-day.today b::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-left: 3px; vertical-align: middle; }
  .bk-day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .bk-day[aria-pressed="true"] span, .bk-day[aria-pressed="true"] small { color: var(--on-accent); }
  .bk-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .bk-chip { flex: none; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
  .bk-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .bk-scroll { overflow: auto; max-height: min(68vh, 600px); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .bk-grid { display: grid; position: relative; width: 100%; }
  .bk-corner, .bk-head { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bk-corner { left: 0; z-index: 5; grid-column: 1; grid-row: 1; }
  .bk-head { display: flex; flex-direction: column; padding: 6px 6px 5px; min-width: 0; border-left: 1px solid var(--grid); }
  .bk-head b { font-size: 13px; line-height: 1.3; }
  .bk-head small { font-size: 11px; color: var(--muted); line-height: 1.25; }
  .bk-time { position: sticky; left: 0; z-index: 3; grid-column: 1; background: var(--surface); border-top: 1px solid var(--grid); padding: 2px 6px 0 0; text-align: right; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .bk-time.half { color: var(--muted); }
  .bk-off, .bk-free { min-width: 0; border: 0; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); border-radius: 0; }
  .bk-off { background: var(--surface-2); opacity: 0.7; }
  .bk-gap { min-width: 0; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); background: var(--surface-2); opacity: 0.45; }
  .bk-free { background: var(--surface); color: var(--axis); font-size: 18px; line-height: 1; padding: 0; }
  .bk-free:hover, .bk-free:focus-visible { background: var(--accent-soft); color: var(--accent-text); }
  .bk-card { position: relative; z-index: 1; margin: 2px 3px; padding: 4px 8px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1px; text-align: left; border-radius: 8px; border: 1px solid var(--line); border-left: 4px solid var(--axis); background: var(--surface-2); color: var(--ink); }
  .bk-card:hover { filter: brightness(0.97); }
  .bk-card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .bk-card[data-drag] { cursor: grab; }
  .bk-card.dragging { opacity: 0.4; cursor: grabbing; }
  .bk-ghost { position: absolute; z-index: 2; box-sizing: border-box; pointer-events: none; padding: 3px 6px; overflow: hidden; border-radius: 8px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 600; line-height: 1.3; }
  .bk-ghost small { display: block; font-weight: 500; font-size: 11px; }

    var no = {}; SCENES.forEach(function (sc, i) { no[sc.id] = i + 1; });
    root.innerHTML = header() +
      '<div class="hero"><h1>Dari masalah sehari-hari, biarkan sistem yang menyelesaikannya</h1>' +
      '<p>Ikuti satu periode kerja di klinik: jadwal disiapkan, lalu satu hari penuh dari absen pagi sampai laporan malam, dan ditutup dengan gajian dan laporan akhir bulan. Setiap layar bisa dicoba.</p>' +
      '<div class="row" style="margin-top:20px"><a class="btn primary" href="#' + SCENES[0].id + '">Mulai dari awal periode</a></div></div>' +
      BAB.map(function (b) {
        return '<div class="bab"><h2>' + esc(b.t) + '</h2><p>' + esc(b.d) + '</p><div class="cards">' + b.ids.map(function (id) {
          var sc = SCENES.filter(function (x) { return x.id === id; })[0];
          return '<a class="card-link" href="#' + sc.id + '"><span class="n">Masalah ' + no[id] + ' · ' + esc(sc.waktu) + '</span><h3>' + esc(sc.title) + '</h3><span class="a">Sekarang: ' + esc(sc.now) + '</span><span class="b">Dengan sistem: ' + esc(sc.with) + '</span></a>';
        }).join('') + '</div></div>';
      }).join('');
  }
  function scenePage(i) {
    var s = SCENES[i], prev = SCENES[i - 1], next = SCENES[i + 1];
    var nav = '<div class="scene-nav"><a class="btn sm" href="#daftar">' + ic('left') + ' Semua masalah</a><div class="row">' +
      (prev ? '<a class="btn sm" href="#' + prev.id + '">' + ic('left') + ' Sebelumnya</a>' : '') +
      '<span class="muted" style="font-size:13px">' + (i + 1) + ' dari ' + SCENES.length + '</span>' +
      (next ? '<a class="btn sm primary" href="#' + next.id + '">Berikutnya ' + ic('right') + '</a>' : '') + '</div></div>';
    root.innerHTML = header() + nav +
      '<div class="scene"><div class="story"><span class="tag">Masalah ' + (i + 1) + ' · ' + esc(s.waktu) + '</span><div class="muted" style="font-size:12px">' + esc(s.bab) + '</div><h2>' + esc(s.title) + '</h2>' +
      '<div class="box before"><small>Sekarang</small>' + esc(s.now) + '</div>' +
      '<div class="box after"><small>Dengan sistem</small>' + esc(s.with) + '</div>' +
      '<div class="row">' + s.who.map(function (w) { return chip('info', w); }).join('') + '<span class="muted" style="font-size:12px">yang melihat layar ini</span></div></div>' +
      '<div class="stage" id="stage-host"></div></div>';
    s.build($('#stage-host'));
  }
  function route() {
    var h = (location.hash || '').replace('#', '') || 'daftar';
    var idx = -1; SCENES.forEach(function (s, i) { if (s.id === h) { idx = i; } });
    if (idx < 0) { listPage(); } else { scenePage(idx); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
