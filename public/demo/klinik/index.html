<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prototype Sistem Klinik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
  /* Konsep: cerita per masalah. Kiri: masalah dan hasilnya dalam bahasa owner. Kanan: layar aplikasi yang bisa diklik. */
  :root {
    --bg: #f3f6f7;
    --surface: #ffffff;
    --surface-2: #edf2f4;
    --ink: #0e1a21;
    --ink-2: #44535c;
    --muted: #78868e;
    --line: #dbe2e6;
    --accent: #2a78d6;
    --accent-text: #1c5cab;
    --accent-soft: #e2edfb;
    --on-accent: #ffffff;
    --good: #0ca30c;
    --good-ink: #006300;
    --good-soft: #e3f4e3;
    --warn: #fab219;
    --warn-ink: #7a5200;
    --warn-soft: #fdf1d3;
    --bad: #d03b3b;
    --bad-ink: #a42525;
    --bad-soft: #fbe5e5;
    --series-1: #2a78d6;
    --grid: #e3e8ea;
    --axis: #c3cbd0;
    --c-p: #e2edfb;
    --c-s: #fdf1d3;
    --c-m: #dcf1ec;
    --c-long: #ece8fb;
    --shadow: 0 1px 2px rgba(14, 26, 33, 0.06), 0 8px 24px rgba(14, 26, 33, 0.06);
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1317;
      --surface: #141c22;
      --surface-2: #1b252c;
      --ink: #eaf0f3;
      --ink-2: #b4c1c8;
      --muted: #8a979f;
      --line: #27333b;
      --accent: #3987e5;
      --accent-text: #6da7ec;
      --accent-soft: #162a43;
      --on-accent: #ffffff;
      --good-ink: #3ec43e;
      --good-soft: #14301a;
      --warn-ink: #fab219;
      --warn-soft: #3a2d0c;
      --bad-ink: #ee7a7a;
      --bad-soft: #3a1717;
      --series-1: #3987e5;
      --grid: #232e35;
      --axis: #38454e;
      --c-p: #162a43;
      --c-s: #3a2d0c;
      --c-m: #12332d;
      --c-long: #2a2447;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1317;
    --surface: #141c22;
    --surface-2: #1b252c;
    --ink: #eaf0f3;
    --ink-2: #b4c1c8;
    --muted: #8a979f;
    --line: #27333b;
    --accent: #3987e5;
    --accent-text: #6da7ec;
    --accent-soft: #162a43;
    --on-accent: #ffffff;
    --good-ink: #3ec43e;
    --good-soft: #14301a;
    --warn-ink: #fab219;
    --warn-soft: #3a2d0c;
    --bad-ink: #ee7a7a;
    --bad-soft: #3a1717;
    --series-1: #3987e5;
    --grid: #232e35;
    --axis: #38454e;
    --c-p: #162a43;
    --c-s: #3a2d0c;
    --c-m: #12332d;
    --c-long: #2a2447;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 56px;
  }
  .muted { color: var(--muted); }
  .sub { color: var(--ink-2); }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Banner & header */
  .demo-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--warn-soft); color: var(--warn-ink);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    border-radius: 10px; padding: 8px 12px; font-size: 13px;
  }
  .demo-bar svg { width: 18px; height: 18px; flex: none; }
  svg { max-width: 100%; }
  .topbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 18px 0 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .logo svg { width: 16px; height: 16px; stroke: var(--on-accent); }

  /* Buttons & chips */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink);
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn svg, .chip svg { width: 15px; height: 15px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
  }
  .chip.good { background: var(--good-soft); color: var(--good-ink); }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .chip.info { background: var(--accent-soft); color: var(--accent-text); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; min-height: 36px; font-weight: 500; color: var(--ink-2);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  /* Index */
  .hero h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; font-weight: 800; }
  .hero p { margin-top: 12px; max-width: 62ch; color: var(--ink-2); font-size: 17px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-top: 28px; }
  .card-link {
    display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: inherit; min-width: 0;
  }
  .card-link:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .card-link .n { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .card-link h3 { font-size: 17px; line-height: 1.3; }
  .card-link .a { font-size: 13px; color: var(--muted); }
  .card-link .b { font-size: 13px; color: var(--ink-2); }

  /* Scene */
  .scene-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
  .scene { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 28px; align-items: start; }
  .story { display: flex; flex-direction: column; gap: 16px; }
  .story h2 { font-size: clamp(22px, 3vw, 28px); line-height: 1.2; font-weight: 800; }
  .story .tag { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .box { border-radius: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
  .box small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
  .box.before small { color: var(--bad-ink); }
  .box.after small { color: var(--good-ink); }
  .stage { display: flex; justify-content: center; min-width: 0; }
  .app {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
  }
  .app.wide { max-width: 100%; }
  .app-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .app-bar b { font-family: var(--font-display); font-size: 15px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .app-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }
  .panel { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); min-width: 0; }
  .panel.soft { background: var(--surface-2); border-color: transparent; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile .l { font-size: 12px; color: var(--muted); }
  .tile .v { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .hero-fig { font-family: var(--font-display); font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
  .list { display: flex; flex-direction: column; }
  .li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .li .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .li .t small { display: block; color: var(--muted); font-size: 12px; }
  .ava { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  td.r, th.r { text-align: right; }
  tr.total td { font-weight: 700; border-bottom: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  input[type="text"], input[type="number"], input[type="time"], select, textarea {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); min-width: 0;
  }
  textarea { min-height: 88px; resize: vertical; }
  .rp { position: relative; }
  .rp > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  .rp input { padding-left: 38px; }
  .chk { display: flex; gap: 8px; align-items: center; min-height: 32px; font-size: 13px; color: var(--ink-2); }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .switch { display: inline-flex; align-items: center; gap: 10px; }
  .switch button {
    width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--axis); position: relative; padding: 0; flex: none;
  }
  .switch button::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s;
  }
  .switch button[aria-checked="true"] { background: var(--accent); }
  .switch button[aria-checked="true"]::after { transform: translateX(18px); }
  .bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 999px; }
  .hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .hbar .trk { height: 14px; display: flex; }
  .hbar .trk i { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .callout { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; border-radius: 10px; padding: 8px 10px; }
  .callout svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .callout.good { background: var(--good-soft); color: var(--good-ink); }
  .callout.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .callout.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .callout.info { background: var(--accent-soft); color: var(--accent-text); }
  .notes { font-size: 12px; color: var(--muted); }

  /* Roster */
  .roster td, .roster th { padding: 4px; text-align: center; }
  .roster td.name { text-align: left; padding-left: 8px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .roster th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .roster .grp td { background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; text-align: left; padding: 6px 8px; }
  .cell {
    width: 100%; min-width: 46px; min-height: 36px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--muted);
  }
  .cell.P { background: var(--c-p); color: var(--accent-text); }
  .cell.S { background: var(--c-s); color: var(--warn-ink); }
  .cell.M { background: var(--c-m); color: var(--good-ink); }
  .cell.PL, .cell.SL, .cell.L, .cell.F { background: var(--c-long); color: var(--ink); border-color: var(--line); }
  .cell.CUTI { background: var(--bad-soft); color: var(--bad-ink); }
  .checks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
  .checks > div { text-align: center; font-size: 11px; border-radius: 8px; padding: 4px 2px; }
  .checks .ok { background: var(--good-soft); color: var(--good-ink); }
  .checks .no { background: var(--warn-soft); color: var(--warn-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); }
  .legend b { font-weight: 600; color: var(--ink); }

  .selfie { width: 72px; height: 72px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); flex: none; }
  .selfie svg { width: 30px; height: 30px; }
  .stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .stepper > div { font-size: 11px; text-align: center; padding: 6px 2px; border-radius: 8px; background: var(--surface-2); color: var(--muted); overflow-wrap: anywhere; }
  .stepper > div.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .stepper > div.done { background: var(--good-soft); color: var(--good-ink); }

  /* Tooltip, toast, modal */
  .tip {
    position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px;
    border-radius: 8px; font-size: 12px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%);
  }
  .chartbox { position: relative; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 50;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 420px); box-shadow: var(--shadow);
  }
  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 18, 0.55); display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--surface); border-radius: 16px; padding: 18px; width: min(100%, 440px); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
  .modal h3 { font-size: 18px; }

  @media (max-width: 860px) {
    .scene { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  }
  @media (max-width: 460px) {
    .hero-fig { font-size: 48px; }
    .hbar { grid-template-columns: 92px minmax(0, 1fr) auto; font-size: 12.5px; }
    .tile .v { font-size: 18px; }
    .app-body { padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .switch button::after { transition: none; }
  }
</style>

<script>
(function () {
  'use strict';

  /* ---------- Util ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  };
  var fmt = function (n) { return Math.round(n).toLocaleString('id-ID'); };
  var rp = function (n) { return (n < 0 ? '-' : '') + 'Rp' + fmt(Math.abs(n)); };
  var jt = function (n) { return (Math.round(n * 10) / 10).toString().replace('.', ',') + ' jt'; };
  var pad2 = function (n) { return String(n).padStart(2, '0'); };
  var hm = function (min) { return Math.floor(min / 60) + ':' + pad2(Math.round(min % 60)); };
  var toMin = function (t) { var p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); };
  var fromMin = function (m) { return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); };

  var ICON = {
    check: '<path d="M5 12.5l4.2 4.2L19 7"/>',
    warn: '<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.6v.1"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    left: '<path d="M15 5l-7 7 7 7"/>',
    right: '<path d="M9 5l7 7-7 7"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
    repeat: '<path d="M17 3l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.2a7 7 0 0114 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="10" r="2.5"/>',
    camera: '<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.500" r="3.500"/><path d="M9 7l1.500-2.500h3L15 7"/>',
    cross: '<path d="M12 5v14M5 12h14"/>'
  };
  var ic = function (name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  };
  var chip = function (kind, label, icon) {
    return '<span class="chip ' + kind + '">' + (icon ? ic(icon) : '') + esc(label) + '</span>';
  };
  var callout = function (kind, icon, html) {
    return '<div class="callout ' + kind + '">' + ic(icon) + '<div>' + html + '</div></div>';
  };

  /* ---------- Data contoh (semua fiktif) ---------- */

        '<div class="grid3"><div class="tile"><div class="l">Kunjungan</div><div class="v num">' + (tb + tl) + '</div></div><div class="tile"><div class="l">Pasien baru</div><div class="v num">' + tb + '</div></div><div class="tile"><div class="l">Kas diterima</div><div class="v num" style="font-size:18px">' + jt(tk / 1000000) + '</div></div></div>' +
        '<div class="tablewrap"><table><thead><tr><th>Tgl</th><th class="r">Baru</th><th class="r">Lama</th><th class="r">Home visit</th><th class="r">Kas diterima</th></tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td>' + r.wd + ' ' + r.d + (r.d === 17 ? ' (berjalan)' : '') + '</td><td class="r num">' + r.baru + '</td><td class="r num">' + r.lama + '</td><td class="r num">' + r.hv + '</td><td class="r num">' + rp(r.kas) + '</td></tr>'; }).join('') +
        '<tr class="total"><td>Total</td><td class="r num">' + tb + '</td><td class="r num">' + tl + '</td><td class="r num">' + th + '</td><td class="r num">' + rp(tk) + '</td></tr></tbody></table></div>' +
        '<div class="row"><button type="button" class="btn primary" data-dl="Excel">Unduh Excel</button><button type="button" class="btn" data-dl="PDF">Unduh PDF</button></div>' +
        '<p class="notes">Tombol unduh hanya contoh di prototype. Di sistem sungguhan file langsung terunduh. Angka diambil dari data layar lain, dan lembar nyata klinik tidak dipakai.</p>';
      el.innerHTML = frame('Laporan', 'Owner', body, 'wide');
      el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('button') : null; if (!t) { return; }
        var f = t.getAttribute('data-dl'); if (f) { toast('Di sistem sungguhan, file ' + f + ' terunduh dalam satu klik.'); }
      });
    }
  });

  /* M10: Booking */
  add({
    id: 'm10', title: 'Permintaan terapis perempuan atau laki-laki terpenuhi',
    now: 'Pasien kadang meminta terapis dengan jenis kelamin tertentu, dan jadwal dicek manual satu per satu.',
    with: 'Booking menyaring terapis dari jadwal shift yang sebenarnya, jadi permintaan pasien langsung terlihat tersedia atau tidak.',
    who: ['Front desk', 'Pasien'],
    build: function (el) {
      var B = S.booking;
      var hash = function (s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 9973; } return h; };
      var cardsHtml = function () {
        var ths = PEOPLE.filter(function (p) { return p.role === 'T' && isWork(resolve(p, B.day)) && (B.pref === 'all' || p.g === B.pref); });
        if (!ths.length) { return callout('warn', 'warn', 'Tidak ada terapis ' + (B.pref === 'f' ? 'perempuan' : 'laki-laki') + ' yang bertugas pada hari ' + DAYS_FULL[B.day] + '. Coba hari lain.'); }
        return ths.map(function (p) {
          var c = resolve(p, B.day), sh = SHIFTS[c], s = toMin(sh.s), e = toMin(sh.e), slots = '';
          for (var m = s; m + 60 <= e; m += 60) {
            var key = p.id + B.day + m, taken = B.taken[key] || hash(key) % 4 === 0;
            slots += '<button type="button" class="btn sm" data-slot="' + key + '" data-t="' + fromMin(m) + '" data-p="' + p.id + '"' + (taken ? ' disabled' : '') + '>' + fromMin(m) + '</button>';
          }
          return '<div class="panel"><div class="row" style="justify-content:space-between"><div class="row"><span class="ava">' + p.n.charAt(0) + '</span><div><b>' + p.n + '</b><div class="muted" style="font-size:12px">' + (p.g === 'f' ? 'Perempuan' : 'Laki-laki') + ' · ' + sh.n + ' ' + sh.s + '-' + sh.e + '</div></div></div>' + (p.st === 'Freelance' ? chip('', 'Freelance') : '') + '</div>' +
            '<div class="row" style="margin-top:10px">' + slots + '</div></div>';
        }).join('');
      };
      var body =
        '<div class="grid2"><div class="field"><label for="bk-day">Hari</label><select id="bk-day">' + [1, 2, 3, 4, 5, 6, 0].map(function (i) { return '<option value="' + i + '"' + (i === B.day ? ' selected' : '') + '>' + DAYS_FULL[i] + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="bk-sv">Layanan</label><select id="bk-sv"><option>Physio reguler (60 menit)</option><option>Paket 12x, sesi berikutnya</option></select></div></div>' +
        '<div><div class="lbl" style="margin-bottom:6px">Pasien meminta terapis</div>' + seg('pref', [['all', 'Siapa saja'], ['f', 'Perempuan'], ['m', 'Laki-laki']], B.pref) + '</div>' +
        '<div id="bk-msg">' + (B.last ? callout('good', 'check', B.last) : '') + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px" id="cards">' + cardsHtml() + '</div>' +
        '<p class="notes">Jadwal terapis mengikuti layar 2. Ubah jadwal di sana dan pilihan di sini ikut berubah. Jam yang pudar sudah terisi.</p>';
      el.innerHTML = frame('Booking', 'Front desk', body);
      el.addEventListener('change', function (e) { if (e.target.id === 'bk-day') { B.day = parseInt(e.target.value, 10); B.last = ''; $('#bk-msg', el).innerHTML = ''; $('#cards', el).innerHTML = cardsHtml(); } });
      el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('button') : null; if (!t) { return; }
        if (t.getAttribute('data-seg') === 'pref') { B.pref = t.getAttribute('data-v'); $$('[data-seg="pref"]', el).forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); }); $('#cards', el).innerHTML = cardsHtml(); return; }
        var key = t.getAttribute('data-slot');
        if (key) {
          B.taken[key] = true; var p = byId(t.getAttribute('data-p'));
          B.last = 'Booking dibuat: ' + DAYS_FULL[B.day] + ' ' + t.getAttribute('data-t') + ' bersama ' + p.n + '. Pengingat WhatsApp masuk ke daftar reminder.';
          $('#bk-msg', el).innerHTML = callout('good', 'check', B.last); $('#cards', el).innerHTML = cardsHtml();
        }
      });
    }
  });

  /* M11: Kas kecil */
  add({
    id: 'm11', title: 'Kas kecil rapi, tidak lagi di Excel',
    now: 'Kas kecil dicatat di Excel tanpa kategori, bukti, atau hitung fisik. Saldo bisa negatif tanpa penjelasan.',
    with: 'Setiap pengeluaran punya kategori, pencatat, dan bukti. Saldo dihitung otomatis, dan hitung fisik mencatat selisihnya.',
    who: ['Front desk', 'Finance', 'Owner'],
    build: function (el) {
      var saldo = function () { return S.kasOpen + S.kas.reduce(function (a, x) { return a + x.amt; }, 0); };
      var ledger = function () {
        var run = S.kasOpen;
        var rows = S.kas.map(function (x) {
          run += x.amt;
          return '<tr><td>' + x.d + '</td><td style="white-space:normal;min-width:130px"><b>' + esc(x.ket) + '</b><div class="muted" style="font-size:11px">' + esc(x.cat) + ' · ' + esc(x.by) + (x.talang ? ' · ditalangi ' + esc(x.talang) : '') + '</div></td><td class="r num">' + (x.amt >= 0 ? '+' : '') + fmt(x.amt) + '<div class="muted" style="font-size:11px">saldo ' + fmt(run) + '</div></td></tr>';
        });
        return '<div class="tablewrap"><table><thead><tr><th>Tgl</th><th>Keterangan</th><th class="r">Jumlah dan saldo</th></tr></thead><tbody><tr><td colspan="2" class="muted">Saldo awal</td><td class="r num">' + fmt(S.kasOpen) + '</td></tr>' + rows.reverse().join('') + '</tbody></table></div>';
      };
      var bycat = function () {
        var m = {}; S.kas.forEach(function (x) { if (x.amt < 0) { m[x.cat] = (m[x.cat] || 0) - x.amt; } });
        var arr = Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
        var mx = arr.length ? arr[0][1] : 1;
        return arr.map(function (r) { return '<div class="hbar"><span style="overflow-wrap:anywhere">' + esc(r[0]) + '</span><span class="trk"><i style="width:' + (r[1] / mx * 100) + '%"></i></span><span class="num">' + rp(r[1]) + '</span></div>'; }).join('');
      };
      var head = function () {
        var s = saldo();
        return '<div class="panel"><div class="lbl">Saldo kas kecil</div><div class="hero-fig num" style="font-size:40px">' + rp(s) + '</div>' +
          (s < 0 ? '<div style="margin-top:8px">' + callout('warn', 'warn', 'Saldo negatif karena belanja dulu. Pengeluaran ditandai ditalangi sampai top-up masuk.') + '</div>' : '') + '</div>';
      };
      var form =
        '<div class="panel"><div class="sec-title" style="margin-bottom:8px">Catat pengeluaran</div><div class="grid2">' +
        '<div class="field"><label for="k-cat">Kategori</label><select id="k-cat">' + CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="k-amt">Jumlah</label>' + money('k-amt', 65000) + '</div></div>' +
        '<div class="field" style="margin-top:10px"><label for="k-ket">Keterangan</label><input type="text" id="k-ket" value="Galon dan es batu"></div>' +
        '<label class="chk"><input type="checkbox" id="k-tal"> Ditalangi (belanja dulu, uang diganti nanti)</label>' +
        '<div class="row" style="margin-top:8px">' + chip('', 'Foto bukti', 'camera') + chip('', 'Dicatat oleh Kirana') + '</div>' +
        '<div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="exp">Simpan pengeluaran</button><button type="button" class="btn" data-act="top">Top-up Rp1.000.000 (finance)</button></div></div>' +
        '<div class="panel"><div class="sec-title" style="margin-bottom:8px">Hitung fisik (finance)</div><div class="field"><label for="k-fis">Uang fisik di laci</label>' + money('k-fis', 0) + '</div>' +
        '<div id="fis-res" style="margin-top:8px"></div><div class="row" style="margin-top:8px"><button type="button" class="btn" data-act="fis">Bandingkan dan catat selisih</button></div></div>';
      var render = function () {
        $('#kas-head', el).innerHTML = head();
        $('#kas-led', el).innerHTML = ledger();
        $('#kas-cat', el).innerHTML = bycat();
      };
      el.innerHTML = frame('Kas kecil', 'Front desk', '<div id="kas-head"></div>' + form +
        '<div><div class="sec-title" style="margin-bottom:6px">Buku kas</div><div id="kas-led"></div></div>' +
        '<div><div class="sec-title" style="margin-bottom:6px">Pengeluaran per kategori</div><div id="kas-cat"></div></div>' +
        '<p class="notes">Pengeluaran dan top-up yang salah dibatalkan dengan alasan, tidak dihapus.</p>', 'wide');
      render();
      var fisInput = $('#k-fis', el); if (fisInput) { fisInput.value = String(saldo()); }
      el.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('button') : null; if (!t) { return; }
        var act = t.getAttribute('data-act');
        if (act === 'exp') {
          var amt = parseFloat($('#k-amt', el).value) || 0; if (amt <= 0) { toast('Isi jumlah pengeluaran.'); return; }
          var ent = { d: '17 Nov', t: 'EXPENSE', cat: $('#k-cat', el).value, ket: $('#k-ket', el).value || '(tanpa keterangan)', amt: -amt, by: 'Kirana' };
          if ($('#k-tal', el).checked) { ent.talang = 'Kirana'; }
          S.kas.push(ent); render(); toast('Pengeluaran tercatat. Saldo ' + rp(saldo()) + '.');
        }
        if (act === 'top') { S.kas.push({ d: '17 Nov', t: 'TOPUP', cat: 'Top-up dari owner', ket: 'Top-up kas kecil', amt: 1000000, by: 'Finance' }); render(); toast('Top-up tercatat oleh finance.'); }
        if (act === 'fis') {
          var phys = parseFloat($('#k-fis', el).value) || 0, diff = phys - saldo(), box = $('#fis-res', el);
          if (diff === 0) { box.innerHTML = callout('good', 'check', 'Uang fisik cocok dengan saldo sistem.'); return; }
          S.kas.push({ d: '17 Nov', t: 'ADJUSTMENT', cat: 'Lain-lain', ket: 'Selisih hitung fisik: ' + (diff > 0 ? 'lebih' : 'kurang'), amt: diff, by: 'Finance' });
          box.innerHTML = callout('warn', 'warn', 'Selisih ' + rp(diff) + ' dicatat sebagai koreksi beserta pencatatnya.'); render();
        }
      });
    }
  });

  /* ---------- Router & halaman daftar ---------- */
  var root = $('#root');
  var header = function () {
    return '<div class="demo-bar">' + ic('warn') + '<span>Prototype dengan data contoh. Nama, angka, dan tarif di sini fiktif, dan ini belum sistem yang sebenarnya.</span></div>' +
      '<div class="topbar"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" aria-hidden="true">' + ICON.cross + '</svg></span><span>Sistem Klinik</span></div>' +
      '<a class="btn sm" href="#daftar">Daftar masalah</a></div>';
  };
  function listPage() {
    root.innerHTML = header() +
      '<div class="hero"><h1>Dari masalah sehari-hari ke layar yang menyelesaikannya</h1>' +
      '<p>Sebelas masalah nyata di klinik, masing-masing dengan layar yang bisa dicoba. Mulai dari yang paling sering ditanyakan owner setiap hari.</p>' +
      '<div class="row" style="margin-top:20px"><a class="btn primary" href="#m1">Mulai dari masalah 1</a></div></div>' +
      '<div class="cards">' + SCENES.map(function (s, i) {
        return '<a class="card-link" href="#' + s.id + '"><span class="n">Masalah ' + (i + 1) + '</span><h3>' + esc(s.title) + '</h3><span class="a">Sekarang: ' + esc(s.now) + '</span><span class="b">Dengan sistem: ' + esc(s.with) + '</span></a>';
      }).join('') + '</div>';
  }
  function scenePage(i) {
    var s = SCENES[i], prev = SCENES[i - 1], next = SCENES[i + 1];
    var nav = '<div class="scene-nav"><a class="btn sm" href="#daftar">' + ic('left') + ' Semua masalah</a><div class="row">' +
      (prev ? '<a class="btn sm" href="#' + prev.id + '">' + ic('left') + ' Sebelumnya</a>' : '') +
      '<span class="muted" style="font-size:13px">' + (i + 1) + ' dari ' + SCENES.length + '</span>' +
      (next ? '<a class="btn sm primary" href="#' + next.id + '">Berikutnya ' + ic('right') + '</a>' : '') + '</div></div>';
    root.innerHTML = header() + nav +
      '<div class="scene"><div class="story"><span class="tag">Masalah ' + (i + 1) + '</span><h2>' + esc(s.title) + '</h2>' +
      '<div class="box before"><small>Sekarang</small>' + esc(s.now) + '</div>' +
      '<div class="box after"><small>Dengan sistem</small>' + esc(s.with) + '</div>' +
      '<div class="row">' + s.who.map(function (w) { return chip('info', w); }).join('') + '<span class="muted" style="font-size:12px">yang melihat layar ini</span></div></div>' +
      '<div class="stage" id="stage-host"></div></div>';
    s.build($('#stage-host'));
  }
  function route() {
    var h = (location.hash || '').replace('#', '') || 'daftar';
    var idx = -1; SCENES.forEach(function (s, i) { if (s.id === h) { idx = i; } });
    if (idx < 0) { listPage(); } else { scenePage(idx); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
